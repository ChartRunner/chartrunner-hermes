name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit, contract and HTTP tests (no internet)
        run: python3 -m unittest tests/test_plugin.py -v
      - name: Byte-compile
        run: python3 -m compileall -q chartrunner_plugin scripts __init__.py
